# lmd-v0.0.1 volumes with instance (cell / neurite) annotation, for promptable segmentation.
#
# THE HELD-OUT SPLIT. Never trained on; referenced from a run config's [val_data].
#
# Referenced from a run config with:
#
#   [data]
#   name = "miao_volumes"
#   config_path = "configs/data/lmd_instances.yaml"
#
# Generated and verified by
# /nrs/scicompsoft/orhane/mia-train-scratch/sam3d/make_instances_config.py -- every path below was
# opened, and its image and label groups read, at generation time.
#
# THREE THINGS THIS FILE ENCODES THAT ARE EASY TO GET WRONG.
#
# `bounding_box`. Four of the instance-labelled volumes annotate an offset sub-box rather than the
# whole crop: a centred 256-cube of `em-hydra-zhang2025`, `exm-mouse-liconn-DG` or
# `exm-mouse-liconn-hippocampus` contains ZERO objects (measured -- see
# sam3d/instance_census.txt). Without a box, most crops would be pure background and the model
# would be trained on the claim that there is nothing to segment there. The boxes are in the
# IMAGE's level-0 voxels in xyz order, which is what miao wants; they come from
# lmd_census/eval_bboxes.py, which handles the label-pyramid ratio and axis permutation.
#
# `resolutions`, per volume rather than global. These span 6 nm EM to 10 nm expansion microscopy,
# and each entry asks for that volume's own stored level-0 voxel size, so miao stays on level 0 and
# resamples nothing. The consequence is that a fixed `patch_size` covers a different physical
# extent per volume. That is deliberate for a promptable model -- prompt coordinates are normalised
# by the crop, so what the model sees is a consistent frame containing objects at varying scale --
# but it is NOT the right setting for a model that has to reason about absolute size. Harmonising
# on physical scale needs each ExM volume's `exp_factor`, which this corpus does not record
# uniformly.
#
# `output_axes = "lcxyz"`. Volumes are stored both xyz and zyx; miao reorders them. Unlike the
# affinity task there is no channel convention to violate here -- a prompt is a position in
# whatever frame the crop arrives in, and the labels arrive in the same frame -- but the boxes
# above are written in xyz and would be transposed under any other order.
#
# CROP CAPACITY. `patch_size` and the volume list are coupled: miao refuses at startup if a
# volume's box cannot contain the requested window, so raising the crop means dropping volumes.
# Measured over the ten candidates:
#
#     cube  64 / 96 : 10 volumes
#     cube 128 - 192:  8 volumes  (loses both Kasthuri15 crops, 100 slices deep)
#     cube 256      :  6 volumes  (also loses the two 192-deep LICONN volumes)
#
# 256 is the setting here, and it is the LARGEST crop every listed volume can supply -- a run
# config may lower `patch_size` freely (the smoke run uses 128), but raising it past 256 makes
# miao refuse at startup. To change it, edit CUBE in sam3d/make_instances_config.py and
# regenerate; the volume list and the held-out split both follow from it.
#
# Excluded at this crop: em-mouse-Kasthuri15-ac3ac4-cortex/crop-001_ac3_100slices
#   (annotated box is 100 deep, at or under the 256 crop)
#
# Excluded at this crop: em-mouse-Kasthuri15-ac3ac4-cortex/crop-002_ac4_100slices
#   (annotated box is 100 deep, at or under the 256 crop)
#
# Excluded at this crop: exm-mouse-liconn-DG-20250809_ExPID19-02_2ndGel_C5_Atto488_40XW_002/crop-001
#   (annotated box is 193 deep, at or under the 256 crop)
#
# Excluded at this crop: exm-mouse-liconn-hippocampus-202507013_ExPID10-02_2percentAA_S2_Atto488_40XW_004/crop-001
#   (annotated box is 192 deep, at or under the 256 crop)

output_axes: "lcxyz"
patch_size: [256, 256, 256]
samples_per_epoch: 64

# miao requires a global resolution setting even when every volume overrides it, which every volume
# below does. Nothing reads this value; it is here to satisfy that check, and a run that somehow
# did fall through to it would be reading an 8 nm isotropic level that several of these stores do
# not have.
resolutions: [[8, 8, 8]]

volumes:
  # 54,047 instances; stored zyx, 1066x8615x6963 at 12.95,9.709,9.709 nm
  - name: "exm-mouse-liconn-ExPID82-1/crop-002_sub"
    path: "/groups/miaai/miaai/lmd-v0.0.1/data/exm-mouse-liconn-ExPID82-1/crop-002_sub.zarr"
    image_key: "raw"
    label_key: "labels/proofread-cell-agglom-dense-v20240123"
    zarr_version: "zarr3"
    resolutions: [[9.709, 9.709, 12.95]]
    bounding_box: [[15, 6963], [15, 8615], [15, 1066]]
    weight: 1.0
    normalize: true

