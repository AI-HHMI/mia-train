# NISB "train_100" setting: the 100-cube training split, 20x the data of `nisb_base.yaml`.
#
#   [data]
#   name = "miao_volumes"
#   config_path = "configs/data/nisb_train_100.yaml"
#
# Paths point at `train_100-ngff`, a metadata-only sidecar generated by
# `experiments/simmim_vs_direct/nisb_ngff_sidecar.py`. NISB publishes these cubes as plain zarr v2 (`data.zarr` with flat
# `img`/`seg` arrays -- what the benchmark's own BANIS code reads), and miao needs OME-NGFF. The
# sidecar supplies the missing `.zattrs` and symlinks `s0` at the published arrays, so this reads
# the downloaded data in place; nothing was copied or converted. See that tool's docstring.
#
# Verified against `base`: train_100/seed0 is byte-identical to base/seed0, and train_100's val
# cube is byte-identical to base's, so numbers here are directly comparable to the base runs.
#
# Benchmark rules: seeds 0-99 are the training cubes and the only ones listed below. seed100 (val)
# selects hyperparameters and belongs in a [val_data] section; seed101 (test) is scored once and
# never read during training.

resolutions: [[9, 9, 20]]

# NISB is stored x,y,z and the benchmark's affinity channels are defined against that order; the
# affinity algorithm asserts it rather than trusting it.
output_axes: "lcxyz"

patch_size: [512, 512, 512]
samples_per_epoch: 1000

# Only one scale level exists -- the published cubes carry no pyramid -- so a coarser
# `resolutions` request fails here rather than silently downsampling.
volumes:
  - name: "NISB train_100 seed0"
    path: "/groups/miaai/miaai/lmd-v0.0.1/nisb/train_100-ngff/train/seed0.zarr"
    image_key: "img"
    label_key: "labels/seg"
    zarr_version: "zarr2"
    weight: 0.01
    normalize: true
  - name: "NISB train_100 seed1"
    path: "/groups/miaai/miaai/lmd-v0.0.1/nisb/train_100-ngff/train/seed1.zarr"
