# NISB "train_100" setting: the 100-cube training split, 20x the data of `nisb_base.yaml`.
#
#   [data]
#   name = "miao_volumes"
#   config_path = "configs/data/nisb_train_100.yaml"
#
# Paths are `dev/nisb/train_100`, which is published as OME-NGFF zarr v3 like `base` and reads
# directly. This used to point at a hand-built `train_100-ngff` sidecar: NISB originally published
# these cubes as plain zarr v2 (`data.zarr` with flat `img`/`seg` arrays, what the benchmark's own
# BANIS code reads) while miao needs OME-NGFF, so a throwaway script wrote the missing metadata and
# symlinked it at the published arrays. Both that sidecar and the script are gone, and nothing
# replaces them because the reorganised tree needs neither -- see `nisb_base.yaml` for what the
# same move cost the eval path.
#
# Verified against `base` on the pre-reorg tree: train_100/seed0 was byte-identical to base/seed0
# and their val cubes matched, so numbers here are directly comparable to the base runs.
#
# Benchmark rules: seeds 0-99 are the training cubes and the only ones listed below. seed100 (val)
# selects hyperparameters and belongs in a [val_data] section; seed101 (test) is scored once and
# never read during training.

resolutions: [[9, 9, 20]]

# NISB is stored x,y,z and the benchmark's affinity channels are defined against that order; the
# affinity algorithm asserts it rather than trusting it.
output_axes: "lcxyz"

patch_size: [512, 512, 512]
samples_per_epoch: 1000

# These cubes now carry a pyramid (`raw` has s0-s4, labels s0-s3), which the hand-built sidecar
# they replaced did not. So a coarser `resolutions` request no longer fails loudly here -- it
# selects a downsampled level, exactly as it does for `base`. The request above asks for the
# stored 9x9x20 nm, which keeps miao on s0.
volumes:
  - name: "NISB train_100 seed0"
    path: "/groups/miaai/miaai/lmd-v0.0.1/dev/nisb/train_100/train/seed0.zarr"
    image_key: "raw"
    label_key: "labels/public_gt-cell-nisb"
    zarr_version: "zarr3"
    weight: 0.01
    normalize: true
  - name: "NISB train_100 seed1"
    path: "/groups/miaai/miaai/lmd-v0.0.1/dev/nisb/train_100/train/seed1.zarr"
