# Short GPU validation run: real data, real config path, small enough to finish in minutes.
#
# Exists to exercise what CPU/Gloo tests cannot — NCCL, real bf16 autocast, the host-to-device
# batch move, FSDP2 on CUDA, and DCP checkpointing — before committing to a long pretraining run.
#
#   bsub -P <project> -q gpu_h100 -gpu "num=2" -n 24 -W 0:30 ... \
#     torchrun --standalone --nproc_per_node=2 src/train.py --config configs/mae_smoke.toml
#
# [parallelism] must multiply to the torchrun world size.

experiment_name = "mae_smoke"

[model]
name = "vit3d"
img_size = [64, 64, 64]
patch_size = [16, 16, 16]   # 4^3 = 64 patches per sample
in_channels = 1
embed_dim = 384
depth = 6
num_heads = 6

[algorithm]
name = "mae"
# Axis order comes from the dataset, so it is not restated here.
mask_ratio = 0.75
decoder_embed_dim = 192
decoder_depth = 2
decoder_num_heads = 6
norm_pix_loss = true

[data]
name = "miao_volumes"
# Both volumes are reordered into this layout despite being stored differently on disk
# (jiefu is zyx, h01 is xyz), which is what output_axes is for.
output_axes = "lcxyz"
patch_size = [64, 64, 64]
samples_per_epoch = 1000

# 33 nm, not 32, and the single nanometre matters a lot. miao picks the coarsest pyramid
# level whose voxel is <= the target on EVERY axis. h01's z is 33 nm at every level, so a
# 32 nm request disqualifies all of them and falls back to the finest (4 nm) level: measured,
# that reads [512, 512, 63] = 16.5 M voxels per sample instead of [66, 66, 64] = 0.28 M, a
# ~59x difference for identical output. 33 nm is also the finest isotropic scale h01 actually
# has. Single entry because vit3d is single-scale.
resolutions = [[33, 33, 33]]

[[data.volumes]]
name = "Jiefu Cerebellum FIB-SEM"
path = "/groups/miaai/miaai/lmd-v0.0.1/jiefu-cerebellum-fibsem_crop.zarr"
image_key = "raw"
zarr_version = "zarr3"
weight = 0.5
normalize = true   # uint8 on disk, so this maps to [0, 1] by dtype max

[[data.volumes]]
name = "H01 Human Cortex"
path = "/groups/miaai/miaai/lmd-v0.0.1/h01-human-cortex.zarr"
image_key = "raw"
zarr_version = "zarr3"
weight = 0.5
normalize = true

[trainer]
max_steps = 50
batch_size = 2          # samples per step per rank
lr = 1.0e-4
warmup_steps = 5
min_lr_ratio = 0.1
weight_decay = 0.05
grad_clip_norm = 1.0
precision = "bf16"
log_every = 5
checkpoint_every = 25   # small, so one run exercises DCP save twice
num_workers = 4
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 2
tp = 1
