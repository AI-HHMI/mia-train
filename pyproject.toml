[project]
name = "mia-train"
version = "0.1.0"
description = "PyTorch-native distributed training framework"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.0",
    "tensorboard>=2.0",
    "miao-io>=0.1.3",
]

[project.optional-dependencies]
cellmap = [
    "datasets>=2.0",
    "pillow>=9.0",
]
# Connected-components for the affinity task, computed in the dataloader's workers. Optional
# because `affinity_seg` is correct without it -- it falls back to the torch implementation in
# `algorithms/affinity/targets.py`, which runs on the training device -- but that fallback costs
# roughly 107 ms of every 377 ms step at 256^3, so a serious affinity run wants this installed.
affinity = [
    "connected-components-3d>=3.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast single-process CPU unit tests for registries, configs, and single layers",
    "cpu_dist: multi-process CPU distributed tests using the Gloo backend (no GPU required)",
    "gpu_dist: multi-process GPU distributed tests requiring CUDA hardware",
    "slow: long-running tests, e.g. convergence sanity checks",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# `experiments` is deliberately absent, and adding it back would fail: it holds no Python at all
# now. It held two scripts, and typechecking them put the core quality gate around code no test
# covers, one of which reached into a sibling repo by `sys.path` insert -- so a core refactor
# could be blocked by a plotting script whose dependencies live elsewhere. That one moved to the
# `banis` repo that owns what it imports; the other was a one-off and was deleted. Experiments are
# configs, submission scripts and write-ups.
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["zarr.*"]
follow_imports = "skip"
