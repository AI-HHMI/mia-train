[project]
name = "mia-train"
version = "0.1.0"
description = "PyTorch-native distributed training framework"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "tensorboard>=2.0",
    "miao-io>=0.1.3",
]

[project.optional-dependencies]
# The CellMap datasets are published on the HuggingFace Hub as parquet and read through
# `datasets`, which memory-maps them as Arrow shards. Kept optional so the core install stays
# torch + tensorboard + miao-io; `data/cellmap.py` imports it lazily and says so if it is absent.
cellmap = [
    "datasets>=2.0",
    "pillow>=9.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast single-process CPU unit tests for registries, configs, and single layers",
    "cpu_dist: multi-process CPU distributed tests using the Gloo backend (no GPU required)",
    "gpu_dist: multi-process GPU distributed tests requiring CUDA hardware",
    "slow: long-running tests, e.g. convergence sanity checks",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests", "experiments"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["zarr.*"]
follow_imports = "skip"
