# large_inputs, arm vit_l_dp: the plain ViT3D (models/vit.py) at ViT-L width and depth, global
# attention, one B300 node, pure data parallel -- vitl_dp with the from-scratch architecture in place
# of the DINOv3 port, and the baseline for its windowed arm. What differs from vitl_dp's encoder: no
# CLS or storage tokens, no LayerScale, a plain GELU MLP, and axial RoPE on patch indices with
# learnable per-block frequencies. ViT3D has no tensor-parallel plan, so it runs data parallel only.
# [algorithm], [trainer] and [parallelism] are vitl_dp's (diff them).

experiment_name = "large_inputs__vit_l_dp"

[model]
name = "vit3d"
img_size = [512, 512, 512]      # overridden per trial by capability_sweep.py --size
patch_size = [16, 16, 16]
in_channels = 1
embed_dim = 1024          # ViT-L width and depth, as vitl_dp
depth = 24
num_heads = 16
mlp_ratio = 4.0
attention_backend = "sdpa"      # B300: cuDNN SDPA, as vitl_dp's use_fa4 = false
rotary_base = 10000.0

[algorithm]
name = "affinity_seg"
long_range = 10
decoder = "subpixel"
input_axes = "lcxyz"      # stated because the sweep builds the algorithm without a dataset
decoder_hidden_dim = 256
decoder_readout_dim = 16
decoder_refine_depth = 2
decoder_zero_init_output = false
split_disconnected = true # forced off inside the sweep, which has no dataloader workers to run it
decode_chunks = 1         # overridden per crop by --decode-chunks auto

[data]
name = "miao_volumes"
config_path = "experiments/large_inputs/data/hemibrain_crop003_train.yaml"
samples_per_epoch = 100000
defer_image_ops = true

[trainer]
max_steps = 100000
batch_size = 1            # per data-parallel rank; the crop is the variable, not the batch
lr = 1.0e-4
warmup_steps = 500
weight_decay = 0.05
grad_clip_norm = 1.0
precision = "bf16"
compile = false
activation_checkpointing = true
num_workers = 8
log_every = 50

[parallelism]
dp_replicate = 1
dp_shard = 8
tp = 1
