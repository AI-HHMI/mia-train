# Arm A stage 1: SimMIM self-supervised pretraining on the NISB training cubes,
# starting from Meta's 2D DINOv3 ViT-L/16 inflated to 3D.

experiment_name = "simmim_vs_direct__A1_simmim_pretrain"

[model]
name = "dinov3_vit3d"
img_size = 512            # 32^3 = 32768 tokens at patch 16
patch_size = 16           # fixed by the checkpoint: the in-plane kernel transfers as is
in_chans = 1
embed_dim = 1024          # ViT-L/16, 303M parameters
depth = 24
num_heads = 16
n_storage_tokens = 4      # the released ViTs carry 4 registers
layerscale_init = 1.0e-05 # NOT optional -- the released weights were trained with LayerScale
mask_k_bias = true        # ditto: the checkpoint carries a masked key bias per block
pos_embed_rope_dtype = "fp32"
pos_embed_rope_type = "superposition"

[init]
path = "/groups/miaai/miaai/pretrained_models/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
inflate_2d_to_3d = true   # (1024,3,16,16) -> (1024,1,16,16,16): RGB averaged, spread over depth
skip = ["rope_embed."]    # derived from `base`, not learned; 2D and 3D disagree on length
strict = true

[algorithm]
name = "simmim"
mask_ratio = 0.6
mask_granularity = 2      # hide 2x2x2 patch blocks, i.e. 32 voxels across
norm_pix_loss = false

[data]
name = "miao_volumes"
config_path = "configs/data/nisb_base.yaml"
patch_size = [512, 512, 512]
samples_per_epoch = 1000

[val_data]
name = "miao_volumes"
config_path = "configs/data/nisb_base.yaml"
patch_size = [512, 512, 512]
samples_per_epoch = 32
resolutions = [[9, 9, 20]]
output_axes = "lcxyz"

[[val_data.volumes]]
name = "NISB base val seed100"
path = "/groups/miaai/miaai/lmd-v0.0.1/legacy/nisb/base/val/seed100.zarr"
image_key = "img"
label_key = "labels/seg"
zarr_version = "zarr3"
weight = 1.0
normalize = true

[trainer]
max_steps = 8000
batch_size = 1  # local batch size
lr = 1.0e-4
warmup_steps = 400
min_lr_ratio = 0.1
lr_schedule = "cosine"
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 0.9
patch_embed_lr_mult = 0.2
activation_checkpointing = true
precision = "bf16"
log_every = 50
val_every = 500
checkpoint_every = 1000
num_workers = 6
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 8
tp = 1
