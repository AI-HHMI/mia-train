# Arm C (floor): the same architecture trained on NISB from a random initialisation.

experiment_name = "simmim_vs_direct__C_finetune_from_scratch"

[model]
name = "dinov3_vit3d"
img_size = 512            # 32^3 = 32768 tokens at patch 16
patch_size = 16           # fixed by the checkpoint: the in-plane kernel transfers as is
in_chans = 1
embed_dim = 1024          # ViT-L/16, 303M parameters
depth = 24
num_heads = 16
n_storage_tokens = 4      # the released ViTs carry 4 registers
layerscale_init = 1.0e-05 # NOT optional -- the released weights were trained with LayerScale
mask_k_bias = true        # ditto: the checkpoint carries a masked key bias per block
pos_embed_rope_dtype = "fp32"
# Keeps the 2D rotary channel layout and adds a zero-gated depth angle, so the inflated model
# starts out identical to its 2D self.
pos_embed_rope_type = "superposition"

# No [init] section, and that absence is the whole arm: the encoder keeps the random weights
# `init_weights()` gave it. This is the floor the other two arms are measured against -- without
# it, "pretraining helps" has no scale, because A and B differ only in *which* pretraining.
#
# Everything else, including `pos_embed_rope_type = "superposition"`, is left exactly as the
# other arms have it. Superposition was chosen so an inflated 2D checkpoint starts out behaving
# like its 2D self, a rationale that does not apply to random weights -- but changing it here
# would vary the architecture and the initialisation at once, and the comparison is about the
# initialisation.

[algorithm]
name = "affinity_seg"
long_range = 10
decoder_hidden_dim = 64
split_disconnected = true

[data]
name = "miao_volumes"
config_path = "configs/data/nisb_base.yaml"
patch_size = [512, 512, 512]
samples_per_epoch = 1000

# seed100 is the benchmark's validation cube. Never trained on, in either stage.
[val_data]
name = "miao_volumes"
config_path = "configs/data/nisb_base.yaml"
patch_size = [512, 512, 512]
samples_per_epoch = 32
resolutions = [[9, 9, 20]]
output_axes = "lcxyz"

[[val_data.volumes]]
name = "NISB base val seed100"
path = "/groups/miaai/miaai/lmd-v0.0.1/nisb/base/val/seed100.zarr"
image_key = "img"
label_key = "labels/seg"
zarr_version = "zarr3"
weight = 1.0
normalize = true

[trainer]
max_steps = 6000
# Per rank. Eight ranks make the global batch 8; one 512-cube per GPU is what fits, and the
# batch is grown with GPUs rather than with samples per GPU for that reason.
batch_size = 1
lr = 1.0e-4
warmup_steps = 300
min_lr_ratio = 0.1
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 0.9
patch_embed_lr_mult = 0.2
# Without this the run needs well over 140 GiB and cannot start; with it, 112.7 GiB peak on a
# 141 GiB H200. The dense head is the reason -- see the README.
activation_checkpointing = true
precision = "bf16"
log_every = 50
val_every = 250
checkpoint_every = 1000
num_workers = 6
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 8
tp = 1
