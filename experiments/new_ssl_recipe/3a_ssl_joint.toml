# Arm 3 (joint SSL) stage 1 of 3: SimMIM on the NISB training cubes from the released DINOv3
# ViT-B/16, with the whole model training from step 0. Nothing precedes it; 3b_ssl_joint_interp
# fine-tunes the encoder it produces, and 3c_ssl_joint_subpixel closes the arm.
#
# This file is 2a_ssl_twophase.toml minus the freeze. Nothing else about it differs -- same
# checkpoint, same masking, same 100k steps, same schedule, same data, same seed -- and the pair
# is the question this experiment exists to answer: is a 2D-pretrained encoder better off sitting
# out the first tenth of an SSL run while its inflated stem and the randomly initialised SimMIM
# head sort themselves out, or better off adapting alongside them?
#
# `new_ssl_recipe` runs three arms off that one checkpoint:
#
#   1  DINOv3 -> interp 50k -> sub-pixel 50k                                    (no SSL at all)
#   2  DINOv3 -> SimMIM 100k with a frozen warm-up -> interp -> sub-pixel
#   3  DINOv3 -> SimMIM 100k joint from step 0     -> interp -> sub-pixel       (this arm)
#
# Arm 3 is also the arm that answers the coarser question: against arm 1, which never does SSL at
# all, it says whether a 100k SimMIM stage on five cubes earns its GPU-hours.
#
#   bsub -P miaai -q gpu_h200 -gpu "num=8" -n 96 -W 16:00 -r -J sslrec_3a \
#     -cwd /groups/scicompsoft/home/orhane/projects/mia-train \
#     -o /nrs/scicompsoft/orhane/mia-train-runs/jobs/sslrec_3a_%J.log \
#     "export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4; \
#      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; \
#      /groups/scicompsoft/home/orhane/myvenv/bin/torchrun --standalone --nproc_per_node=8 \
#        src/train.py --config experiments/new_ssl_recipe/3a_ssl_joint.toml --resume"
#
# The wall clock is the same as 2a's, and not by copy-paste: a freeze does not shorten a step, so
# the two arms cost the same. `-r` with `--resume` make an overrun a requeue rather than a loss.

experiment_name = "sslrec__3a_ssl_joint"

[model]
name = "dinov3_vit3d"
img_size = 256            # 16^3 = 4096 tokens at patch 16
patch_size = 16           # fixed by the checkpoint: the in-plane kernel transfers as is
in_chans = 1
embed_dim = 768           # ViT-B/16: 85.7M released params, 88.2M with a 16^3 single-channel stem
depth = 12                # init_comparison ran the same recipe at ViT-L, ~3.4x the parameters
num_heads = 12            # head_dim 64, the same per-head width the ViT-L has
n_storage_tokens = 4      # the released ViTs carry 4 registers
# Neither of the next two is optional, and both are easy to lose when a config is copied: the
# released weights were trained with LayerScale gains and a per-block masked key bias. A model
# built without them has nowhere to put those tensors, and the architecture it computes is not
# the one that was trained -- `strict` below turns that into an error instead of a silent
# 2-point regression nobody can explain a week later.
layerscale_init = 1.0e-05
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
# Superposition in every stage of every arm, where init_comparison's cold arms use "vanilla":
# nothing here is cold. A released 2D checkpoint says nothing about a third axis, and vanilla --
# which hands depth its own third of the rotary channels -- rearranges the very channel layout
# the pretrained attention was fitted against. Superposition keeps the 2D layout exactly and adds
# a gated depth angle on top, so the weights transfer, the model starts numerically identical to
# its 2D self, and how much depth to mix in is learned rather than assumed. Here the gate learns
# that from step 0 alongside the blocks, which is one of the things arm 3 is testing.
pos_embed_rope_type = "superposition"

[init]
path = "/groups/miaai/miaai/pretrained_models/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth"
inflate_2d_to_3d = true   # (768,3,16,16) -> (768,1,16,16,16): RGB averaged, spread over depth
skip = ["rope_embed."]    # derived from `base`, not learned; 2D and 3D disagree on length
strict = true

[algorithm]
name = "simmim"
mask_ratio = 0.6
mask_granularity = 2      # hide 2x2x2 patch blocks, i.e. 32 voxels across
# Raw intensities as the target, as the paper does. The per-patch standardisation this key turns
# on is MAE's, and the data config already maps these volumes to [0, 1]; applying it would rescale
# a near-empty patch's error up to a structured one's and spend capacity on resin.
norm_pix_loss = false

[data]
name = "miao_volumes"
# The five NISB `base` training cubes at 256^3 with the 16 in-plane rotations/flips. Byte-identical
# to init_comparison's copy, and shared by all eight stages here -- SSL and supervised alike see
# exactly the same crops, so the arms differ in what they do with the data and not in which data
# they get. The labels the config carries are simply unread here; SimMIM's target is the image.
config_path = "experiments/new_ssl_recipe/nisb_base_256_aug.yaml"
samples_per_epoch = 1000  # bookkeeping only; `max_steps` is what ends the run

[val_data]
name = "miao_volumes"
# Self-supervised, so there is no labelled cube to hold out and nothing to hold it out from: the
# number this produces is a reconstruction loss on fresh crops drawn through the training config,
# and it exists to show the pretext task is being learned at all. It is not comparable with the
# affinity losses of the stages that follow, and it selects nothing -- what the SSL stage was
# worth is read off the fine-tuned checkpoints, three stages later.
#
# Nor is it the place to read 2a against 3a. A frozen encoder makes the head's job easier before
# it makes it harder, so the early curves diverge for reasons that say nothing about the features;
# the comparison that counts is 2c against 3c.
config_path = "experiments/new_ssl_recipe/nisb_base_256_aug.yaml"
samples_per_epoch = 32

[trainer]
max_steps = 100000
batch_size = 1            # per rank; 8 ranks -> global batch 8, matching BANIS and every prior run
lr = 3.0e-4
warmup_steps = 2000
min_lr_ratio = 0.01       # linear to 3e-6, so a run that stops early has still annealed
lr_schedule = "linear"
weight_decay = 0.05
grad_clip_norm = 1.0
# One rate for the whole model. The 0.9 x 0.2 pair these two keys carried in the original
# experiment left patch_embed at an effective 1.4e-6, 696x below the baseline's rate, and the
# patch embedding is precisely the layer with the most to relearn -- an inflated RGB kernel now
# reading single-channel EM. Setting both to 1.0 was worth about 11x nERL in banis_parity, so
# neither is a knob to reintroduce quietly.
layerwise_lr_decay = 1.0
patch_embed_lr_mult = 1.0
activation_checkpointing = false  # a ViT-B at 256^3 fits; recomputation is 30% compute for nothing
precision = "bf16"
log_every = 100
val_every = 5000
checkpoint_every = 5000
num_workers = 6
seed = 0

# There is deliberately no `freeze_backbone_steps` here, and no unfreeze ramp either. That absence
# is the entirety of arm 3: from step 0 the blocks, the patch embedding and SimMIM's linear head
# all move together, so the 12 blocks of natural-image representation take their largest updates
# while the head is still noise and the stem is still an averaged RGB kernel finding its scale.
# Whether that costs anything, or whether the encoder simply absorbs it, is what 2a exists to
# measure against.
#
# Written as an omission rather than as an explicit 0. The default is 0 and disables the freeze,
# so the two spellings train identically, but a config that names the key has to be read twice to
# see which arm it is; a config that does not name it says plainly that this arm is the one
# without one. The same goes for the ramp, which is inert whenever the freeze is.

[parallelism]
dp_replicate = 1
dp_shard = 8
tp = 1
