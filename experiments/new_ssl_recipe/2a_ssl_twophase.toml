# Arm 2 (two-phase SSL) stage 1 of 3: SimMIM on the NISB training cubes, starting from the
# released DINOv3 ViT-L/16 and opening with a frozen backbone. Nothing precedes it;
# 2b_ssl_twophase_interp fine-tunes the encoder it produces, and 2c_ssl_twophase_subpixel closes
# the arm.
#
# `new_ssl_recipe` runs three arms off that one checkpoint:
#
#   1  DINOv3 -> interp 100k -> sub-pixel 100k                                  (no SSL at all)
#   2  DINOv3 -> SimMIM 200k with a frozen warm-up -> interp -> sub-pixel       (this arm)
#   3  DINOv3 -> SimMIM 200k joint from step 0     -> interp -> sub-pixel
#
# This file and 3a_ssl_joint.toml differ in exactly two keys, the two at the bottom of [trainer],
# and that difference is the experiment's actual question: is a 2D-pretrained encoder better off
# sitting out the first tenth of an SSL run while its stem and the SSL head sort themselves out?
# Arm 1 answers the coarser question of whether the SSL stage earns its GPU-hours at all.
#
#   bsub -P miaai -q gpu_h200 -gpu "num=8" -n 96 -W 18:00 -r -J sslrec_2a \
#     -cwd /groups/scicompsoft/home/orhane/projects/mia-train \
#     -o /nrs/scicompsoft/orhane/mia-train-runs/jobs/sslrec_2a_%J.log \
#     "export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4; \
#      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; \
#      /groups/scicompsoft/home/orhane/myvenv/bin/torchrun --standalone --nproc_per_node=8 \
#        src/train.py --config experiments/new_ssl_recipe/2a_ssl_twophase.toml --resume"
#
# The wall clock is submit.sh's, which derives it from a measured 0.17 s/step at this size: about
# 9.4 h for 200k, requested with margin; `-r` with `--resume` make an overrun a requeue rather
# than a lost run.

experiment_name = "sslrec__2a_ssl_twophase"

[model]
name = "dinov3_vit3d"
img_size = 256            # 16^3 = 4096 tokens at patch 16
patch_size = 16           # fixed by the checkpoint: the in-plane kernel transfers as is
in_chans = 1
embed_dim = 1024          # ViT-L/16: 303.2M released params, 306.6M with a 16^3 single-channel stem
depth = 24                # the size init_comparison ran this same recipe at
num_heads = 16            # head_dim 64, the same per-head width the aborted ViT-B attempt had
n_storage_tokens = 4      # the released ViTs carry 4 registers
# Neither of the next two is optional, and both are easy to lose when a config is copied: the
# released weights were trained with LayerScale gains and a per-block masked key bias. A model
# built without them has nowhere to put those tensors, and the architecture it computes is not
# the one that was trained -- `strict` below turns that into an error instead of a silent
# 2-point regression nobody can explain a week later.
layerscale_init = 1.0e-05
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
# Superposition in every stage of every arm, where init_comparison's cold arms use "vanilla":
# nothing here is cold. A released 2D checkpoint says nothing about a third axis, and vanilla --
# which hands depth its own third of the rotary channels -- rearranges the very channel layout
# the pretrained attention was fitted against. Superposition keeps the 2D layout exactly and adds
# a gated depth angle on top, so the weights transfer, the model starts numerically identical to
# its 2D self, and how much depth to mix in is learned rather than assumed.
pos_embed_rope_type = "superposition"

[init]
path = "/groups/miaai/miaai/pretrained_models/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
inflate_2d_to_3d = true   # (1024,3,16,16) -> (1024,1,16,16,16): RGB averaged, spread over depth
skip = ["rope_embed."]    # derived from `base`, not learned; 2D and 3D disagree on length
strict = true

[algorithm]
name = "simmim"
mask_ratio = 0.6
mask_granularity = 2      # hide 2x2x2 patch blocks, i.e. 32 voxels across
# Raw intensities as the target, as the paper does. The per-patch standardisation this key turns
# on is MAE's, and the data config already maps these volumes to [0, 1]; applying it would rescale
# a near-empty patch's error up to a structured one's and spend capacity on resin.
norm_pix_loss = false

[data]
name = "miao_volumes"
# The five NISB `base` training cubes at 256^3 with the 16 in-plane rotations/flips. Byte-identical
# to init_comparison's copy, and shared by all eight stages here -- SSL and supervised alike see
# exactly the same crops, so the arms differ in what they do with the data and not in which data
# they get. The labels the config carries are simply unread here; SimMIM's target is the image.
config_path = "experiments/new_ssl_recipe/nisb_base_256_aug.yaml"
samples_per_epoch = 1000  # bookkeeping only; `max_steps` is what ends the run

[val_data]
name = "miao_volumes"
# Self-supervised, so there is no labelled cube to hold out and nothing to hold it out from: the
# number this produces is a reconstruction loss on fresh crops drawn through the training config,
# and it exists to show the pretext task is being learned at all. It is not comparable with the
# affinity losses of the stages that follow, and it selects nothing -- what the SSL stage was
# worth is read off the fine-tuned checkpoints, three stages later.
config_path = "experiments/new_ssl_recipe/nisb_base_256_aug.yaml"
samples_per_epoch = 32

[trainer]
max_steps = 200000
batch_size = 1            # per rank; 8 ranks -> global batch 8, matching BANIS and every prior run
lr = 3.0e-4
warmup_steps = 2000
min_lr_ratio = 0.01       # linear to 3e-6, so a run that stops early has still annealed
lr_schedule = "linear"
weight_decay = 0.05
grad_clip_norm = 1.0
# One rate for the whole model. The 0.9 x 0.2 pair these two keys carried in the original
# experiment left patch_embed at an effective 1.4e-6, 696x below the baseline's rate, and the
# patch embedding is precisely the layer with the most to relearn -- an inflated RGB kernel now
# reading single-channel EM. Setting both to 1.0 was worth about 11x nERL in banis_parity, so
# neither is a knob to reintroduce quietly. It matters twice as much here, where the stem is the
# only thing training for the first tenth of the run.
layerwise_lr_decay = 1.0
patch_embed_lr_mult = 1.0
activation_checkpointing = false  # a ViT-L at 256^3 fits; recomputation is 30% compute for nothing
precision = "bf16"
log_every = 100
val_every = 5000
checkpoint_every = 5000
num_workers = 6
seed = 0

# The frozen warm-up: the one thing arm 2 has that arm 3 does not, and the only reason both arms
# are being run.
#
# For these first steps every parameter of the model outside its input stem is held at the value
# it arrived with, while the patch embedding and SimMIM's head -- a single randomly initialised
# linear layer -- train against a fixed encoder. What that buys is a matter of what starts wrong.
# The transformer blocks are the part that is *right*: 24 blocks of representation learned on
# 1.7B natural images, and the whole point of starting from them. The two parts that are wrong
# are the head, which is noise, and the stem, an RGB kernel averaged and smeared over a depth
# axis it has never seen, now reading single-channel EM. Training all three at once means the
# encoder spends its earliest and largest updates chasing gradients routed through a head that
# cannot yet predict anything, using features extracted by a stem still finding its scale.
# Holding it still lets the two wrong parts converge onto the good one instead of the reverse.
#
# 20k of 200k is a round 10% and is deliberately not tuned: the recipe this comes from calls the
# phase short and leaves it at that, and inventing a precise number here would add a second thing
# arm 2 differs by, which is exactly what the comparison against arm 3 cannot afford.
freeze_backbone_steps = 20000
# The learning rate ramps back up over this many steps once the backbone joins, so the encoder's
# first permitted update is not a full-size one taken against a schedule that has already spent
# 20k steps decaying. The ramp applies to every group, the head included: the head has had those
# 20k steps to itself, and briefly slowing it too is a smaller distortion than running two
# learning-rate schedules side by side.
#
# None of this makes the phase cheap. The stem sits below every block, so backward still traverses
# the whole stack to reach it; what the freeze saves is the weight gradients and the optimizer
# state for the frozen tensors, not the pass. Arm 2 and arm 3 cost the same GPU-hours, which is
# also what makes them a fair pair.
unfreeze_warmup_steps = 1000

[parallelism]
dp_replicate = 1
dp_shard = 8
tp = 1
