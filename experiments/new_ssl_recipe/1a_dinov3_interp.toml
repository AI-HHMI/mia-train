# Arm 1 (control) stage 1 of 2: the released DINOv3 ViT-B/16 fine-tuned straight into affinities
# with the interpolating head. Nothing precedes it -- this stage is where arm 1 begins -- and
# 1b_dinov3_subpixel warm-starts from the encoder it leaves behind, which closes the arm.
#
# `new_ssl_recipe` runs three arms off that one checkpoint:
#
#   1  DINOv3 -> interp 50k -> sub-pixel 50k                            (this arm: no SSL at all)
#   2  DINOv3 -> SimMIM 100k with a frozen warm-up -> interp -> sub-pixel
#   3  DINOv3 -> SimMIM 100k joint from step 0     -> interp -> sub-pixel
#
# Arm 3 against arm 1 is what the SSL stage itself is worth; arm 2 against arm 3 is what the
# frozen warm-up is worth. Arm 1 is the control both of those are measured against, so it has to
# be the other arms with the SimMIM stage deleted and nothing else changed.
#
# The recipe is ../init_comparison/'s, with two deliberate differences: ViT-B rather than ViT-L,
# and every arm starts from the released weights, so nothing here is ever cold.
#
#   bsub -P miaai -q gpu_h200 -gpu "num=8" -n 96 -W 12:00 -r -J sslrec_1a \
#     -cwd /groups/scicompsoft/home/orhane/projects/mia-train \
#     -o /nrs/scicompsoft/orhane/mia-train-runs/jobs/sslrec_1a_%J.log \
#     "export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4; \
#      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; \
#      /groups/scicompsoft/home/orhane/myvenv/bin/torchrun --standalone --nproc_per_node=8 \
#        src/train.py --config experiments/new_ssl_recipe/1a_dinov3_interp.toml --resume"
#
# The wall clock is init_comparison's ViT-L figure scaled to this stage's step count and left
# generous; `-r` together with `--resume` make an overrun a requeue that continues from the last
# checkpoint rather than a lost run.

experiment_name = "sslrec__1a_dinov3_interp"

[model]
name = "dinov3_vit3d"
img_size = 256            # 16^3 = 4096 tokens at patch 16
patch_size = 16           # fixed by the checkpoint: the in-plane kernel transfers as is
in_chans = 1
embed_dim = 768           # ViT-B/16: 85.7M released params, 88.2M with a 16^3 single-channel stem
depth = 12                # init_comparison ran the same recipe at ViT-L, ~3.4x the parameters
num_heads = 12            # head_dim 64, the same per-head width the ViT-L has
n_storage_tokens = 4      # the released ViTs carry 4 registers
# Neither of the next two is optional, and both are easy to lose when a config is copied: the
# released weights were trained with LayerScale gains and a per-block masked key bias. A model
# built without them has nowhere to put those tensors, and the architecture it computes is not
# the one that was trained -- `strict` below turns that into an error instead of a silent
# 2-point regression nobody can explain a week later.
layerscale_init = 1.0e-05
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
# Superposition in every stage of every arm, where init_comparison's cold arms use "vanilla":
# nothing here is cold. A released 2D checkpoint says nothing about a third axis, and vanilla --
# which hands depth its own third of the rotary channels -- rearranges the very channel layout
# the pretrained attention was fitted against. Superposition keeps the 2D layout exactly and adds
# a gated depth angle on top, so the weights transfer, the model starts numerically identical to
# its 2D self, and how much depth to mix in is learned rather than assumed.
pos_embed_rope_type = "superposition"

[init]
path = "/groups/miaai/miaai/pretrained_models/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth"
inflate_2d_to_3d = true   # (768,3,16,16) -> (768,1,16,16,16): RGB averaged, spread over depth
skip = ["rope_embed."]    # derived from `base`, not learned; 2D and 3D disagree on length
strict = true

[algorithm]
name = "affinity_seg"
# The interpolating head is the one that demonstrably trains against an encoder that has never
# seen EM: 0.3691 nERL in banis_parity from these same released weights. Three attempts at the
# sub-pixel head under those conditions all collapsed onto the trivial "everything is connected"
# predictor, which is why every arm here spends its first fine-tuning stage on this head and its
# second on the other one.
decoder = "interpolate"
decoder_hidden_dim = 64

[data]
name = "miao_volumes"
# The five NISB `base` training cubes at 256^3 with the 16 in-plane rotations/flips. Byte-identical
# to init_comparison's copy, and shared by all eight stages here -- SSL and supervised alike see
# exactly the same crops, so the arms differ in what they do with the data and not in which data
# they get.
config_path = "experiments/new_ssl_recipe/nisb_base_256_aug.yaml"
samples_per_epoch = 1000  # bookkeeping only; `max_steps` is what ends the run

[val_data]
name = "miao_volumes"
# The held-out cube, not in any training config: the inline keys below override the YAML's rather
# than extend it, so `volumes` here *replaces* the five training cubes instead of adding a sixth.
config_path = "configs/data/nisb_base.yaml"
patch_size = [256, 256, 256]
# 32 crops is a cheap signal, not a model selector. In subpixel_decoder the lowest val loss did
# not pick the best checkpoint (85k won on loss, 100k on nERL); at this sample count anything
# under ~2 sd is sampling noise, and the arms are compared by scoring checkpoints, not by this.
samples_per_epoch = 32
resolutions = [[9, 9, 20]]
output_axes = "lcxyz"

[[val_data.volumes]]
name = "NISB base val seed100"
path = "/groups/miaai/miaai/lmd-v0.0.1/dev/nisb/base/val/seed100.zarr"
image_key = "raw"
label_key = "labels/public_gt-cell-nisb"
zarr_version = "zarr3"
weight = 1.0
normalize = true

[trainer]
# 50k, where init_comparison gave its phase 1 150k: six supervised stages plus two 100k SSL stages
# have to fit alongside each other, and a ViT-B step is roughly a third of a ViT-L one. The two
# supervised stages of an arm are treated as one 100k plan split in half -- see 1b's learning rate.
max_steps = 50000
batch_size = 1            # per rank; 8 ranks -> global batch 8, matching BANIS and every prior run
lr = 3.0e-4
warmup_steps = 2000
min_lr_ratio = 0.01       # linear to 3e-6, so a run that stops early has still annealed
lr_schedule = "linear"
weight_decay = 0.05
grad_clip_norm = 1.0
# One rate for the whole model. The 0.9 x 0.2 pair these two keys carried in the original
# experiment left patch_embed at an effective 1.4e-6, 696x below the baseline's rate, and the
# patch embedding is precisely the layer with the most to relearn -- an inflated RGB kernel now
# reading single-channel EM. Setting both to 1.0 was worth about 11x nERL in banis_parity, so
# neither is a knob to reintroduce quietly.
layerwise_lr_decay = 1.0
patch_embed_lr_mult = 1.0
activation_checkpointing = false  # a ViT-B at 256^3 fits; recomputation is 30% compute for nothing
precision = "bf16"
log_every = 100
val_every = 5000
checkpoint_every = 5000
num_workers = 6
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 8
tp = 1
