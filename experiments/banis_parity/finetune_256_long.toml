# Can a DINOv3 ViT reach the published BANIS baselines on NISB `base`?
#
# Arm B of simmim_vs_direct scored 2.6% nERL against BANIS-S's 24.4% on the same 5 cubes. This
# changes the three things that measurement pointed at, and nothing else -- same data, same
# objective, same architecture, same evaluation.
#
#   1. the encoder's stem was frozen   layerwise_lr_decay 0.9 x patch_embed_lr_mult 0.2 gave
#                                      patch_embed an effective LR of 1.4e-6, 696x below BANIS'
#                                      1e-3. Both are now 1.0, and the base LR is 3e-4.
#   2. the step budget was 167x short  6000 steps vs BANIS' 1e6. Now 300000.
#   3. no augmentation at all          now the 16 in-plane rotations/flips (see the data config).
#
# The three are deliberately changed together rather than one at a time: at 300k steps on 5 cubes
# augmentation is not a confound to isolate, it is what makes the longer run a fair test.

experiment_name = "banis_parity__finetune_256_long"

[model]
name = "dinov3_vit3d"
img_size = 256            # 16^3 = 4096 tokens at patch 16
patch_size = 16           # fixed by the checkpoint: the in-plane kernel transfers as is
in_chans = 1
embed_dim = 1024          # ViT-L/16, 303M parameters
depth = 24
num_heads = 16
n_storage_tokens = 4      # the released ViTs carry 4 registers
layerscale_init = 1.0e-05 # NOT optional -- the released weights were trained with LayerScale
mask_k_bias = true        # ditto: the checkpoint carries a masked key bias per block
pos_embed_rope_dtype = "fp32"
pos_embed_rope_type = "superposition"

[init]
path = "/groups/miaai/miaai/pretrained_models/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
inflate_2d_to_3d = true
skip = ["rope_embed."]
strict = true

[algorithm]
name = "affinity_seg"
long_range = 10
decoder_hidden_dim = 64
split_disconnected = true

[data]
name = "miao_volumes"
config_path = "experiments/banis_parity/nisb_base_256_aug.yaml"
samples_per_epoch = 1000

[val_data]
name = "miao_volumes"
config_path = "configs/data/nisb_base.yaml"
patch_size = [256, 256, 256]
samples_per_epoch = 32
resolutions = [[9, 9, 20]]
output_axes = "lcxyz"

[[val_data.volumes]]
name = "NISB base val seed100"
path = "/groups/miaai/miaai/lmd-v0.0.1/legacy/nisb/base/val/seed100.zarr"
image_key = "img"
label_key = "labels/seg"
zarr_version = "zarr3"
weight = 1.0
normalize = true

[trainer]
max_steps = 300000
batch_size = 1            # per rank; 8 ranks -> global batch 8, matching arm B and BANIS
lr = 3.0e-4
warmup_steps = 2000
min_lr_ratio = 0.1
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 1.0
patch_embed_lr_mult = 1.0
lr_schedule = "cosine"
activation_checkpointing = false
precision = "bf16"
log_every = 100
val_every = 5000
checkpoint_every = 10000
num_workers = 6
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 8
tp = 1
