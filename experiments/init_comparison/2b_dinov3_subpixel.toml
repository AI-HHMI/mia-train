# Arm 2 phase 2: sub-pixel head on arm 2's encoder.
#
# Part of `init_comparison`. Every arm trains in two phases: the interpolating head first, then the
# sub-pixel head warm-started from it. See README.md.

experiment_name = "init__2b_dinov3_subpixel"

[model]
name = "dinov3_vit3d"
img_size = 256
patch_size = 16
in_chans = 1
embed_dim = 1024          # ViT-L/16
depth = 24
num_heads = 16            # head_dim 64; 64 % 6 = 4, so axial 3D RoPE leaves 4 channels unrotated
n_storage_tokens = 4
layerscale_init = 1.0e-05 # NOT optional: the released weights were trained with LayerScale
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
pos_embed_rope_type = "superposition"

[init]
# Resolved by submit.sh once the previous stage has a run directory; it cannot be known at
# submission time. Phase 1 of this arm.
path = "PREV_CHECKPOINT"
prefix = "model."
# `rope_embed` buffers are derived from `base` by the model's own init_weights, not learned, so the
# model keeps its own and nothing is lost. Skipping them also means a stage can be pointed at any
# trained encoder of this width -- which is how the smoke test exercises this load path without a
# predecessor, and it costs nothing in the real chain, where the RoPE type matches anyway.
skip = ["rope_embed."]
strict = true

[algorithm]
name = "affinity_seg"
long_range = 10
decoder = "subpixel"
decoder_hidden_dim = 256  # width on the token grid, where positions are 4096x cheaper
decoder_readout_dim = 16  # width at voxel resolution -- the number that costs
decoder_refine_depth = 2
# Left at the default `true`, which is correct here and was not in the single-phase attempts: the
# encoder arriving from phase 1 already solves the task, so a randomly initialised dense head would
# push meaningless gradients into good features. This is the configuration that produced 0.4941
# nERL when warm-started from banis_parity.
decoder_zero_init_output = true
split_disconnected = true

[data]
name = "miao_volumes"
config_path = "experiments/init_comparison/nisb_base_256_aug.yaml"
samples_per_epoch = 1000

[val_data]
name = "miao_volumes"
config_path = "configs/data/nisb_base.yaml"
patch_size = [256, 256, 256]
samples_per_epoch = 32
resolutions = [[9, 9, 20]]
output_axes = "lcxyz"

[[val_data.volumes]]
name = "NISB base val seed100"
path = "/groups/miaai/miaai/lmd-v0.0.1/dev/nisb/base/val/seed100.zarr"
image_key = "raw"
label_key = "labels/public_gt-cell-nisb"
zarr_version = "zarr3"
weight = 1.0
normalize = true

[trainer]
max_steps = 100000
batch_size = 1            # per rank; 8 ranks -> global batch 8, matching BANIS and every prior run
# Phase 2 continues the tail of a single 250k-step plan rather than restarting its own: peak
# 1.228e-4 is what a 250k linear schedule reaches at step 150k, and min_lr_ratio 0.0244 lands on
# the same 3e-6 endpoint that plan would. Restarting at the full 3e-4 would be 2.4x higher than
# anything the encoder saw in phase 1.
#
# Caveat: phase 1 is already running with max_steps = 150000, so it anneals fully to 3e-6 by its
# end. The handoff is therefore 3e-6 -> 1.228e-4 rather than genuinely continuous; a truly smooth
# transition needs phase 1 to declare max_steps = 250000 and stop early, which would mean
# restarting it. The 500-step warmup below softens the step up.
lr = 1.228e-4
warmup_steps = 500
min_lr_ratio = 0.0244
lr_schedule = "linear"
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 1.0  # the whole model trains at one rate
patch_embed_lr_mult = 1.0
activation_checkpointing = false
precision = "bf16"
log_every = 100
val_every = 5000
checkpoint_every = 5000
num_workers = 6
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 8
tp = 1

[augment]
# Rotation moved here from the data YAML's per-volume `aug_rot`, which miao removed. "inplane"
# draws from the 16 transforms that never exchange z with x or y; the full 48-transform group is
# refused against this data's 9x9x20 nm voxels, since exchanging axes of unequal size produces
# object shapes that do not occur in the specimen. Same augmentation as before, stated in the run
# rather than per volume.
rotate = "inplane"
