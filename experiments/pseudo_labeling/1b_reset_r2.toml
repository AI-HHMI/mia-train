# Arm 1 ("reset"), round 2. Identical to 1a except for which pseudo-labels it reads.
#
# Arm 1's rule is that every round re-initialises from the *same* encoder rather than from the
# previous round's student, so what accumulates across rounds is pseudo-label quality and not
# parameter drift. NoisyStudent's own ablation (A.2, "Warm-starting the Student Model") reports
# that training the student from scratch beats initialising it from the teacher, and warns that
# warm-starting can leave a model "stuck in a local optimal" -- which is sharper here than there,
# because the pseudo-labels were generated *by* the model arm 2 warm-starts from.
#
# "From scratch" is not available to us: three single-phase attempts at the sub-pixel head from an
# encoder that had never seen EM all collapsed onto the trivial "everything is connected"
# predictor (see init_comparison/README.md). So the reset point is the interpolation-trained
# encoder at 200k -- exactly where teacher_0 itself started -- which keeps the head trainable
# while still discarding everything the teacher learned from its own pseudo-labels.
experiment_name = "pl__1b_reset_r2"

[model]
name = "dinov3_vit3d"
img_size = 256
patch_size = 16
in_chans = 1
embed_dim = 1024
depth = 24
num_heads = 16
n_storage_tokens = 4
layerscale_init = 1.0e-05
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
pos_embed_rope_type = "superposition"
# Stochastic depth is the "noise" half of Noisy Student that lives in the model rather than in the
# data. Off in every previous run here (the default is 0.0) and off in teacher_0, so this is the
# one deliberate departure from the recipe that produced 0.4941 -- a student that is not noised
# has no reason to do anything but reproduce its teacher.
drop_path_rate = 0.1

[init]
# The same reset point as round 1 -- that is the arm's definition. Round 2 differs from round
# 1 in its *data* alone, so any change in the val number is attributable to pseudo-label
# quality rather than to another 50k steps of drift on top of round 1's weights.
path = "/nrs/scicompsoft/orhane/mia-train-runs/banis_parity__finetune_256_long_20260810_123308/checkpoints/step_200000"
prefix = "model."
strict = true

[algorithm]
name = "affinity_seg"
long_range = 10
decoder = "subpixel"
decoder_hidden_dim = 256
decoder_readout_dim = 16
decoder_refine_depth = 2
split_disconnected = true
# Written into the pseudo-label arrays as -1 by `mia_pseudolabel build`. Stated rather than left
# to the default so the abstention contract is visible in the run record: these voxels are
# excluded from the loss, and a change of sign here would silently train on them as instance ids.
ignore_index = -1

[data]
name = "miao_volumes"
# GENERATED by make_round_config.py once round 1's pseudo-labels exist; submit.sh resolves it.
config_path = "ROUND_CONFIG"
samples_per_epoch = 1000

[val_data]
# Real labels on the held-out val cube, unchanged from the teacher's recipe. This is the number
# the arms are compared on, and nothing about pseudo-labelling is allowed to touch it.
name = "miao_volumes"
config_path = "configs/data/nisb_base.yaml"
patch_size = [256, 256, 256]
samples_per_epoch = 32
resolutions = [[9, 9, 20]]
output_axes = "lcxyz"

[[val_data.volumes]]
name = "NISB base val seed100"
path = "/groups/miaai/miaai/lmd-v0.0.1/dev/nisb/base/val/seed100.zarr"
image_key = "raw"
label_key = "labels/public_gt-cell-nisb"
zarr_version = "zarr3"
weight = 1.0
normalize = true

[trainer]
# 100k, not the 10k this ran at before. The 10k came from watching val plateau by step ~3000 --
# but that was measured on 0.93% coverage, where 80,000 crops had already exhausted a tiny,
# heavily-overlapping label set. At full coverage there are ~6.8e11 distinct 256^3 crop centres, so
# 80,000 crops samples about 1e-7 of what exists: the plateau was data exhaustion, not convergence.
# 100k also matches teacher_0's own budget (100k at global batch 8), which makes student-vs-teacher
# a like-for-like comparison rather than one confounded by training length.
max_steps = 10000
# 4 per rank across 2 ranks -- the same global batch of 8 the teacher's recipe used, on a quarter
# of the GPUs. Measured against the 8x1 layout on identical data: 16.4 samples/s against 31.5, so
# 52% of the throughput on 25% of the hardware, at 9.9% MFU against 6.0% and with
# `data_wait_frac` falling from 0.13 to 0.0008. The 8-rank layout was starved -- one 256^3 crop
# per rank per step could not keep 8 input pipelines fed -- so this is both cheaper per stage
# ($2.17 against $4.51) and a far easier thing to schedule than a whole 96-slot node.
batch_size = 4
lr = 3.0e-4
# 2000, not the 500 this was briefly set to. That 500 collapsed both arms onto the trivial
# "everything is connected" predictor -- `affinity_accuracy` tracked `target_positive_rate` to
# within 0.003-0.015 at every step, the signature init_comparison/README.md documents for a
# sub-pixel head that never escapes its initialisation.
#
# Why 2000 and not 1000. The 50k run escaped the trivial predictor between step 400 (lr 6.0e-5,
# accuracy still equal to the positive rate to 5 decimals) and step 800 (lr 1.2e-4, gap 0.07), so
# it needed roughly 800 steps below ~1.2e-4 to find a non-trivial solution. Linear warmup to 3e-4
# over W steps stays under 1.2e-4 for only the first 0.4W steps, so W must be >= 2000 to buy that
# window. W = 1000 gives 400 such steps -- about where the 50k run was still trivial.
#
# The head is randomly initialised in BOTH arms (`prefix = "model."` loads the encoder only), so
# this is not an arm-specific hazard.
warmup_steps = 2000
# 0.001 rather than 0.1: end at 3e-7 instead of 3e-5. With the plateau arriving early, the last
# steps are worth more as consolidation at a genuinely small rate than as continued movement.
min_lr_ratio = 0.001
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 1.0
patch_embed_lr_mult = 1.0
# Linear, not cosine. A cosine spends most of its length near the peak and only anneals late,
# which is the wrong shape here: both arms' val boundary_accuracy saturated by step ~3000 and then
# drifted sideways or *down* for the remaining 7000, so the useful part of the run is early and the
# schedule should get out of its way rather than hold a high rate through the flat region.
lr_schedule = "linear"
activation_checkpointing = false
precision = "bf16"
log_every = 100
val_every = 1000
checkpoint_every = 1000   # 10 ckpts x 4.8 GB = 48 GB; at 5000 a 10k run saves only 2
num_workers = 10   # 12 cores per rank at 24 slots, against 1.5 at 8 ranks on 96
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 2
tp = 1

[augment]
# The other half of the noise, and the reason training on pseudo-labels is not a fixed point.
# A student shown the same clean crops its teacher labelled has nothing to learn but the teacher's
# own function; the signal comes from being asked for the teacher's answer on a *corrupted* input.
#
# `drop_slice_prob`, `intensity` and `noise_scale` are image-only -- the labels do not move -- so
# they are noise in the Noisy Student sense. `rotate` and `shift_slice_prob` move image and labels
# together, so they buy equivariance rather than robustness; both are kept because teacher_0's
# recipe and the reference recipe use them, but neither is what makes this work.
#
# Values are BANIS' own defaults, as used by init_comparison's augmentation arm.
rotate = "inplane"
drop_slice_prob = 0.05
shift_slice_prob = 0.05
shift_magnitude = 10
intensity = true
mul_intensity = 0.1
add_intensity = 0.1
noise_scale = 0.5
