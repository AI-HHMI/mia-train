# gary_comparison arm 5a: arm 1a with the UNETR DECODER. Released DINOv3 LVD-1689M -> `affinity_seg`,
# one stage of 500k steps, every setting 1a's except the decoder (and two throughput lines below).
# Requested 2026-09-23/24: the colleague credits his UNETR decoder for his better scores, and this
# arm tests that one change against 1a on identical data, schedule and scoring.
#
# The decoder is `layers.common.dense_heads.UNETRHead`: the tokens after
# blocks 6/12/18/24 (1-based) of the ViT-L, brought back to voxels in four x2 transposed-convolution
# stages at widths 16/32/64/128 and fused at full resolution with a residual block on the raw image.
# Measured cost on one B300 at this crop: ~1.4x the sub-pixel head's step, 16 GiB
# (probes/unetr-feasibility).
#
# Throughput lines only, NOT the recipe: 1a ran 8 ranks x batch 1; only 3 B300 GPUs were free, so
# this arm runs 2 ranks x batch 4 -- the same global batch 8, the same samples per epoch and the
# same schedule (the trainer has no gradient accumulation, and 3 GPUs cannot make 8). num_workers
# 11 per rank because each rank now needs four crops per step (12 slots per GPU: 1 + 11).
# Submit with GPUS=2 SMOKE_GPUS=2 WALL=240:00.
#
# What follows is 1a's own header, true of this arm as well.
#
# gary_comparison arm 1a: released DINOv3 LVD-1689M -> `affinity_seg` with the sub-pixel head, in ONE
# stage of 500k steps, on the colleague's split of the hemibrain Ellipsoid Body crop (README.md, data/).
#
# lmd_ssl_v1's arm-2 recipe (2b_dinov3_lvd_finetune_interpolate -> 2c_..._subpixel) with these
# deliberate departures, requested 2026-09-16:
#   - axial ("vanilla") 3D RoPE instead of superposition
#   - torch SDPA + torch.compile instead of FlashAttention-4
#   - the sub-pixel head from step 0; no interpolating warm-up stage, no encoder hand-over
#   - lr 3e-4 with 5k warmup, 500k steps, samples_per_epoch 100k, 8 loader workers
#   - log every 1k, validate every 10k, checkpoint every 50k
#
# Launch with TORCHINDUCTOR_LAYOUT_OPTIMIZATION=0 exported: inductor's layout optimisation together
# with the head's 3-wide voxel-resolution convolutions kills compiled runs at step 1 with a cuDNN
# SDPA stride error. Runs go to --output-root
# /nrs/scicompsoft/orhane/mia-train-experiments/gary_comparison/runs (bare --resume scans it).
experiment_name = "gary__5a_dinov3_axial_unetr"

[model]
name = "dinov3_vit3d"
img_size = 256            # 16^3 = 4096 tokens at patch 16
patch_size = 16
in_chans = 1
embed_dim = 1024          # ViT-L/16, 303M parameters
depth = 24
num_heads = 16            # head_dim 64; 64 % 6 = 4, so axial 3D RoPE leaves 4 channels unrotated
n_storage_tokens = 4
layerscale_init = 1.0e-05 # NOT optional: the released weights were trained with LayerScale
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
pos_embed_rope_type = "vanilla"
# 0.0 where 2b-c wrote 0.1, functionally the same setting: DINOv3's drop path is sample-level
# stochastic depth, and at one sample per rank the dropped subset is always empty, so 0.1 dropped
# nothing there either. Written as what happens, so it cannot switch on silently if the per-rank
# batch ever changes.
drop_path_rate = 0.0
# torch SDPA (cuDNN on Hopper/Blackwell). FA4 is off because `[trainer].compile` below cannot be
# combined with it, and it buys nothing at 4096 tokens anyway.
use_fa4 = false

[init]
path = "/groups/miaai/miaai/pretrained_models/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
inflate_2d_to_3d = true   # the (1024,3,16,16) patch kernel, averaged over RGB and spread over z
skip = ["rope_embed."]    # a 2D checkpoint says nothing about z; the 3D RoPE tables are rebuilt
strict = true

[algorithm]
name = "affinity_seg"
long_range = 10           # nearest-neighbour offsets plus 10-voxel ones, as in every arm before
decoder = "unetr"         # 1a: "subpixel" with hidden 256 / readout 16 / refine 2, which play no part here
decoder_skip_layers = [5, 11, 17, 23]  # 0-based: blocks 6/12/18/24, the ends of the stack's quarters (the default)
decoder_widths = [16, 32, 64, 128]     # channels at strides 1/2/4/8 (the default); 2x these hits cuDNN's 2^31 at 256^3
decoder_image_skip = true              # the raw-image path, the head's only input finer than a token (the default)
decoder_zero_init_output = false
# Id 0 (3.7% of this volume; one train crop was 57% id 0) is BACKGROUND here: every pair touching
# it is a cut and stays in the loss. Only -1 is ignored, and miao never emits -1. See README.md.
split_disconnected = true

[data]
# z < 3000 of the crop, 75 G voxels, 8 nm, patch 256. The box, axes and resolution are pinned in
# the YAML; verified 2026-09-16 (README.md, "Verification").
name = "miao_volumes"
config_path = "experiments/gary_comparison/data/hemibrain_eb_train.yaml"
samples_per_epoch = 100000  # 12.5k steps per epoch at global batch 8: 40 worker respawns in 500k steps
defer_image_ops = true

[val_data]
# 3000 <= z < 4000. The only place model selection or post-processing thresholds may be fitted;
# the test corner is scored once.
name = "miao_volumes"
config_path = "experiments/gary_comparison/data/hemibrain_eb_val.yaml"
samples_per_epoch = 32
defer_image_ops = true

[trainer]
max_steps = 500000
batch_size = 4            # per rank; x 2 ranks -> global batch 8, as 1a's 1 x 8
lr = 0.0003
warmup_steps = 5000
min_lr_ratio = 0.001
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 1.0  # the stem must move: 0.9 x 0.2 once put patch_embed 696x below BANIS' LR
patch_embed_lr_mult = 1.0
lr_schedule = "linear"
precision = "bf16"
compile = true
activation_checkpointing = false
log_every = 1000
val_every = 10000
checkpoint_every = 50000
num_workers = 11          # 1a: 8. Four crops per rank per step now; 12 slots per GPU = 1 + 11
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 2              # 1a: 8 (a full node). Two B300s; see the header
tp = 1

[augment]
rotate = "inplane"
drop_slice_prob = 0.05
shift_slice_prob = 0.05
shift_magnitude = 10
intensity = true
mul_intensity = 0.1
add_intensity = 0.1
noise_scale = 0.5
