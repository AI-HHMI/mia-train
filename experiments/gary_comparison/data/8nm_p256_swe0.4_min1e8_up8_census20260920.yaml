#     87%. Their union bounding box is 76.8 G voxels against 4.74 T summed — a redundancy of
#     ~62x. Across all four acquisitions, 14.8 T of apparent data is roughly 0.31 T of
#     distinct tissue, 0.35% of the corpus. Downweighting them does not fix this. A per-volume
#     weight sets how often the group is sampled; it cannot make 87% of any two tiles stop
#     being the same voxels. The correct weight is ~1/62, which makes them a rounding error
#     while still costing 347 volumes of dataloader overhead and heavy read amplification. NOT
#     an argument about resolution. These are 8.72 x 8.72 x 55.56 nm, but the STITCHED
#     mirrorscope volumes (FlyID49) are 4.906 x 4.906 x 31.25 nm — the same 6.4x anisotropy,
#     and also upsampled in z (3.9x) to reach an 8 nm isotropic ladder. Both are kept or
#     dropped on redundancy, not on z sampling; FlyID49 is in the config at ~11% of an epoch.
#     This reverses no earlier decision: no config ever shipped with these. All four
#     pretraining configs predating the recipe rewrite contain zero unstitched volumes, and
#     the last census committed before it (570 stores) had none. The four acquisitions landed
