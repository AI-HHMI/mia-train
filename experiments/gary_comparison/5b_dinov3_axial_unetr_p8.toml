# gary_comparison arm 5b: arm 4a (= arm 1a at PATCH 8) with the UNETR DECODER. Released DINOv3
# LVD-1689M -> `affinity_seg`, one stage of 500k steps on one full B300 node, every setting 4a's except
# the decoder lines. Requested 2026-09-24. 5b vs 4a is the decoder at 64 nm tokens; 5b vs 5a (UNETR at
# patch 16) is the token size under the same decoder.
#
# At patch 8 the decoder has three x2 stages (not 5a's four): tokens after blocks 8/16/24 (1-based) at
# widths 16/32/64, fused at full resolution with a residual block on the raw image
# (`layers.common.dense_heads.UNETRHead`). Measured on one B300 at this crop, batch 1,
# compiled: 563 ms and ~46 GiB per step against 4a's head's 530 ms and 41 GiB
# (probes/unetr-feasibility/bench_p8.py). Expected ~0.59 s/step on 8 ranks (4a's measured 0.553 +
# the head's ~0.033), so ~3.4 days for 500k steps. Submit with WALL=240:00 from the worktree.
#
# What follows is 4a's own header, true of this arm as well.
#
# gary_comparison arm 4a: arm 1a at PATCH 8. Released DINOv3 LVD-1689M -> `affinity_seg` with the
# sub-pixel head, one stage of 500k steps, every setting 1a's except `patch_size` 16 -> 8 (and the
# comments that describe it). Requested 2026-09-23 after the colleague's setup came to light: 8 nm
# data, 8^3-voxel patches, a UNETR decoder. At patch 8 a token covers 64 nm instead of 128 nm and
# a 256^3 crop is 32,768 tokens instead of 4,096; the crop, the head, the data and the schedule are
# unchanged, so 4a vs 1a is the value of the finer token alone, with our own decoder.
# Arm 4b is this arm initialised from SAT-493M instead of LVD-1689M.
#
# Submit with WALL=240:00: 32,768 tokens make each step several times 1a's 0.26 s (sam_lmd_v1's
# patch-8 arm 3 ran 1.29 s/step at the same token count, with checkpointing and a heavier head).
#
# What follows is 1a's own header, true of this arm as well.
#
# lmd_ssl_v1's arm-2 recipe (2b_dinov3_lvd_finetune_interpolate -> 2c_..._subpixel) with these
# deliberate departures, requested 2026-09-16:
#   - axial ("vanilla") 3D RoPE instead of superposition
#   - torch SDPA + torch.compile instead of FlashAttention-4
#   - the sub-pixel head from step 0; no interpolating warm-up stage, no encoder hand-over
#   - lr 3e-4 with 5k warmup, 500k steps, samples_per_epoch 100k, 8 loader workers
#   - log every 1k, validate every 10k, checkpoint every 50k
#
# Launch with TORCHINDUCTOR_LAYOUT_OPTIMIZATION=0 exported: inductor's layout optimisation together
# with the head's 3-wide voxel-resolution convolutions kills compiled runs at step 1 with a cuDNN
# SDPA stride error. Runs go to --output-root
# /nrs/scicompsoft/orhane/mia-train-experiments/gary_comparison/runs (bare --resume scans it).
experiment_name = "gary__5b_dinov3_axial_unetr_p8"

[model]
name = "dinov3_vit3d"
img_size = 256            # 32^3 = 32768 tokens at patch 8
patch_size = 8            # 1a: 16. 64 nm tokens at 8 nm, the colleague's patch
in_chans = 1
embed_dim = 1024          # ViT-L (released as /16), 303M parameters
depth = 24
num_heads = 16            # head_dim 64; 64 % 6 = 4, so axial 3D RoPE leaves 4 channels unrotated
n_storage_tokens = 4
layerscale_init = 1.0e-05 # NOT optional: the released weights were trained with LayerScale
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
pos_embed_rope_type = "vanilla"
# 0.0 where 2b-c wrote 0.1, functionally the same setting: DINOv3's drop path is sample-level
# stochastic depth, and at one sample per rank the dropped subset is always empty, so 0.1 dropped
# nothing there either. Written as what happens, so it cannot switch on silently if the per-rank
# batch ever changes.
drop_path_rate = 0.0
# torch SDPA (cuDNN on Hopper/Blackwell). FA4 is off because `[trainer].compile` below cannot be
# combined with it, and on B300 it was no faster than cuDNN SDPA at 33k tokens either (0.88x end to
# end for the 7B model in experiments/b300_capability_run).
use_fa4 = false

[init]
path = "/groups/miaai/miaai/pretrained_models/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
# The (1024,3,16,16) patch kernel, averaged over RGB and spread over z, then pseudo-inverse resized
# to 8^3 (FlexiViT block sums, utils.pretrained), as sam_lmd_v1's patch-8 arm 3 loaded it.
inflate_2d_to_3d = true
skip = ["rope_embed."]    # a 2D checkpoint says nothing about z; the 3D RoPE tables are rebuilt
strict = true

[algorithm]
name = "affinity_seg"
long_range = 10           # nearest-neighbour offsets plus 10-voxel ones, as in every arm before
decoder = "unetr"         # 4a: "subpixel" with hidden 256 / readout 16 / refine 2, which play no part here
decoder_skip_layers = [7, 15, 23]      # 0-based: blocks 8/16/24, the ends of the stack's thirds (the default at patch 8)
decoder_widths = [16, 32, 64]          # channels at strides 1/2/4 (the default); patch 8 has three x2 stages
decoder_image_skip = true              # the raw-image path, the head's only input finer than a token (the default)
decoder_zero_init_output = false
# Id 0 (3.7% of this volume; one train crop was 57% id 0) is BACKGROUND here: every pair touching
# it is a cut and stays in the loss. Only -1 is ignored, and miao never emits -1. See README.md.
split_disconnected = true

[data]
# z < 3000 of the crop, 75 G voxels, 8 nm, patch 256. The box, axes and resolution are pinned in
# the YAML; verified 2026-09-16 (README.md, "Verification").
name = "miao_volumes"
config_path = "experiments/gary_comparison/data/hemibrain_eb_train.yaml"
samples_per_epoch = 100000  # 12.5k steps per epoch at 8 ranks x batch 1: 40 worker respawns in 500k steps
defer_image_ops = true

[val_data]
# 3000 <= z < 4000. The only place model selection or post-processing thresholds may be fitted;
# the test corner is scored once.
name = "miao_volumes"
config_path = "experiments/gary_comparison/data/hemibrain_eb_val.yaml"
samples_per_epoch = 32
defer_image_ops = true

[trainer]
max_steps = 500000
batch_size = 1            # per rank; x 8 ranks -> global batch 8
lr = 0.0003
warmup_steps = 5000
min_lr_ratio = 0.001
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 1.0  # the stem must move: 0.9 x 0.2 once put patch_embed 696x below BANIS' LR
patch_embed_lr_mult = 1.0
lr_schedule = "linear"
precision = "bf16"
compile = true
activation_checkpointing = false
log_every = 1000
val_every = 10000
checkpoint_every = 50000
num_workers = 8
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 8              # one full node
tp = 1

[augment]
rotate = "inplane"
drop_slice_prob = 0.05
shift_slice_prob = 0.05
shift_magnitude = 10
intensity = true
mul_intensity = 0.1
add_intensity = 0.1
noise_scale = 0.5
