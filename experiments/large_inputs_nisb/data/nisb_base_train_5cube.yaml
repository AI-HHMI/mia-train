# large_inputs_nisb training data: the first 5 of NISB base's 5 training cubes. GENERATED by make_configs.py.
#
# Copied 2026-10-02 from experiments/data_scaling/nisb_base_5cube_256.yaml (mia-train 36ff8f6),
# with defer_image_ops added. The cube sets are data_scaling's:
# nested, in seed order (seed0; seed0-2; seed0-4), with equal weights.
#
# 9x9x20 nm is the stored level-0 voxel, so miao reads level 0 and resamples nothing. x, y, z is the
# stores' own axis order. Each cube is 3000 x 3000 x 1350 voxels, 27 um on every side.
resolutions: [[9, 9, 20]]
output_axes: lcxyz
# miao validates this file as a whole config before the run config's keys override it, so it needs a
# patch_size. The window is what the arms vary: each arm's TOML sets its own, and that is what runs.
patch_size: [256, 256, 256]
samples_per_epoch: 1000   # the run config overrides this
defer_image_ops: true
volumes:
  - name: NISB base seed0
    path: /groups/miaai/miaai/lmd-v0.0.1/dev/nisb/base/train/seed0.zarr
    image_key: raw
    label_key: labels/public_gt-cell-nisb
    zarr_version: zarr3
    weight: 0.2
    normalize: true   # uint8 on disk, so this maps to [0, 1] by dtype max
  - name: NISB base seed1
    path: /groups/miaai/miaai/lmd-v0.0.1/dev/nisb/base/train/seed1.zarr
    image_key: raw
    label_key: labels/public_gt-cell-nisb
